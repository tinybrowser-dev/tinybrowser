[package]
name = "net"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Kept on so `cargo test -p net` exercises the socket transport it tests and a
# standalone consumer gets the working engine. A crate that must build for a
# host without sockets depends on this crate with `default-features = false`.
default = ["native"]
# The hyper + native-tls transport, system DNS with `--resolve` rewrites, and
# the proxy/TLS configuration types it consumes. The fetch core compiles
# without this feature: a host without sockets supplies its own `Transport`
# (the wasm component's host contract, an in-memory conformance origin).
native = [
    "dep:hyper",
    "dep:hyper-tls",
    "dep:hyper-util",
    "dep:native-tls",
    "dep:tokio-native-tls",
    "dep:tower-service",
    "tokio/net",
    "tokio/time",
]
vendored-tls = ["native-tls?/vendored"]

[dependencies]
base64 = "0.23"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"], optional = true }
hyper-tls = { version = "0.6", features = ["alpn"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"], optional = true }
native-tls = { version = "0.2", features = ["alpn"], optional = true }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tokio-native-tls = { version = "0.3", optional = true }
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["io-util"] }
tower-service = { version = "0.3", optional = true }
async-compression = { version = "0.4", features = ["tokio", "gzip", "deflate", "zlib", "brotli"] }
cookies = { workspace = true }
enumerated = { workspace = true }
secure-context = { workspace = true }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
flate2 = "1"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "macros"] }
