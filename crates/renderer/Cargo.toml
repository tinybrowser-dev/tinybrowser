[package]
name = "renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
webstorage = { workspace = true }
enumerated = { workspace = true }
net = { workspace = true }
secure-context = { workspace = true }
# Parser QualNames flow into Blitz as one type, no conversion layer.
markup5ever = { workspace = true }
# The XML `Name` production for `createProcessingInstruction`; the parser fork
# owns the only copy of the table.
xml5ever = { workspace = true }
encoding_rs = "0.8"
# Already in Cargo.lock and the shipping binary. Direct deps so renderer can
# call them: `data-url` for engine data URLs and `atob`,
# `percent-encoding` for `javascript:` URL decoding, `base64` for `btoa` and
# FileReader encoding.
data-url = "0.3"
percent-encoding = "2"
base64 = "0.23"
# `@font-face` and `FontFace` sources may be WOFF/WOFF2; the font table wants
# an sfnt, so both loaders decode through the same crate Blitz uses.
wuff = { workspace = true }
# CSP hash-source checks (`'sha256-'`, `'sha384-'`, `'sha512-'`).
sha2 = "0.11"
# Web Crypto entropy must come from the operating system, never the JS PRNG.
getrandom = "0.4"
# ECMA-402 formatting uses a locale-filtered ICU4X blob generated for the
# supported locale set; compiled_data would retain every CLDR locale.
fixed_decimal = { version = "0.7.2", features = ["ryu"] }
icu_calendar = { version = "2.3.0", default-features = false }
icu_datetime = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_decimal = { version = "2.3.0", default-features = false, features = ["alloc", "ryu", "serde"] }
icu_experimental = { version = "0.6.0", default-features = false, features = ["ryu", "serde"] }
icu_locale = { version = "2.3.1", default-features = false, features = ["serde"] }
icu_locale_core = "2.3.0"
icu_provider = { version = "2.3.1", default-features = false }
icu_provider_adapters = { version = "2.3.0", features = ["serde"] }
icu_provider_blob = { version = "2.3.0", features = ["alloc"] }
writeable = "0.6"
# The engine waits on nothing itself: `time` for timer deadlines, `sync` for
# the wake handle, `macros` for `select!`. A carrier brings its own runtime.
tokio = { version = "1.53", default-features = false, features = ["time", "sync", "macros"] }
url = { version = "2", features = ["serde"] }
# QuickJS-ng via rquickjs; `std` uses shipped linux bindings (no bindgen).
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "loader", "macro"] }
# Value-only seam for script results crossing to a carrier.
serde = { version = "1", features = ["derive"] }
# Style / layout / paint.

parley = { version = "0.12", default-features = false, features = ["libm"] }
png = "0.18"
# SVG `naturalWidth`/`naturalHeight` read Blitz's parsed intrinsic lengths.
svgtypes = "0.16"
# Stylo is a `links` crate: one copy per graph. The blitz fork pins
# servo/stylo; the renderer's direct stylo use must pin the same rev or the
# resolver builds a second servo_style_crate and fails.
style = { package = "stylo", version = "0.23.0", git = "https://github.com/servo/stylo", rev = "2dca34592ced37c6aa01733e94206a767194cf9d" }
style_traits = { package = "stylo_traits", version = "0.23.0", git = "https://github.com/servo/stylo", rev = "2dca34592ced37c6aa01733e94206a767194cf9d" }
# Full Blitz adoption: DOM + parse + paint replace the in-tree pipeline.
# Pinned exact: beta drift is fast, and Cargo.lock pins the rest. The pin
# must track `version.workspace` in third_party/blitz/Cargo.toml, or
# [patch.crates-io] stops matching and the registry beta compiles instead.
# `floats` is not a Blitz default but the published stylo_taffy only
# initializes `float`/`clear` with it. `writing-mode` turns on vertical
# `writing-mode` layout (each box laid out in its own writing-mode frame) and
# the Stylo pref that generates the property; the renderer enables it because
# CSSOM View's geometry and scrolling algorithms depend on it.
blitz-dom = { version = "=0.3.0-beta.4", features = ["floats", "writing-mode"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
# Patched to the blitz fork's vendored copy: the published 0.3.0-beta.4 lacks
# CopyStyleGetters, which keeps the renderer's clone_* calls compiling.
stylo_taffy = "=0.3.0-beta.4"
anyrender_tiny_skia = { path = "../anyrender-tiny-skia" }
# SVG <img> sources must be rasterized into pixels for drawImage; the SVG
# renderer is already linked through blitz-paint, so this adds no new code.
# Match the requirements blitz-paint declares so a Blitz bump cannot pull a
# second copy of either crate into the graph.
anyrender_svg = "0.15.0"
kurbo = "0.13.1"
# Canvas 2D rasterization. Already in the graph through anyrender_tiny_skia,
# so the canvas context adds no new crate to the binary.
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
# `JpegQuality` turns the canvas `0..=1` quality into the encoder's `1..=100`
# without a float-to-integer cast lint suppression. Already in the graph
# through `image` and `icu`, so this adds no new crate.
num-traits = "0.2"
# Canvas text draws the glyph outlines parley shaped. The same skrifa version
# is already linked by anyrender-tiny-skia.
skrifa = "0.44"
# createImageBitmap decodes Blob bytes. Blitz already enables these formats
# for <img>, so the decoders are in the binary either way. BMP is a decode
# feature the engine opts into: WPT's security-features endpoints encode their
# payloads as BMP, and the choice belongs to the embedder, not the Blitz fork.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
blitz-traits = "=0.3.0-beta.4"
# Inflates the build-compressed JS shims (`js::blob`). Same instance `png`
# already retains, so this adds no new crate to the binary.
flate2 = "1"

[build-dependencies]
# Compresses the embedded JS shims in `build.rs`. Host-side only: nothing
# here ships in the binary.
flate2 = "1"
webidl-bindgen = { path = "../webidl-bindgen" }

[dev-dependencies]
webidl-bindgen = { path = "../webidl-bindgen" }
