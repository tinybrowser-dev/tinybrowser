[package]
name = "cdp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
browser = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http = "1"
net = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server = { workspace = true }
tokio = { version = "1.53", default-features = false, features = ["rt", "net", "sync", "time", "macros"] }
# Sync client (Client) plus server message types; async server I/O is in server::ws.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
