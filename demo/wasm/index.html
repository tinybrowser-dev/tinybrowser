<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tinybrowser in wasm</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.5 ui-monospace, ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        margin: 0 auto;
        max-width: 62rem;
        padding: 1.5rem;
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr 1fr;
      }
      header {
        grid-column: 1 / -1;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 0.25rem;
      }
      p {
        margin: 0;
      }
      label {
        display: block;
        margin-bottom: 0.35rem;
      }
      textarea,
      input {
        box-sizing: border-box;
        font: inherit;
        width: 100%;
      }
      textarea {
        height: 12rem;
      }
      button {
        font: inherit;
        padding: 0.35rem 0.9rem;
      }
      pre {
        margin: 0;
        padding: 0.6rem;
        border: 1px solid currentColor;
        overflow: auto;
        max-height: 22rem;
        white-space: pre-wrap;
      }
      .bar {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin: 0.6rem 0;
      }
      .status {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>tinybrowser, running as a wasm component</h1>
      <p>
        The page below is mounted in the engine. Subresources it names reach the
        server through the demo's hop endpoint, which is what the component's
        host contract asks for.
      </p>
    </header>

    <section>
      <label for="url">Document URL</label>
      <input id="url" value="http://127.0.0.1:8787/hello.txt" />
      <label for="html" style="margin-top: 0.6rem">Document HTML</label>
      <textarea id="html">&lt;!doctype html&gt;
&lt;title&gt;wasm tab&lt;/title&gt;
&lt;p id="out"&gt;waiting for a subresource…&lt;/p&gt;
&lt;script src="/hello.js"&gt;&lt;/script&gt;
&lt;script&gt;
  const out = document.getElementById("out");
  fetch("/redirect")
    .then((response) =&gt; response.text())
    .then((body) =&gt; fetch("/echo").then((echo) =&gt; echo.text()).then((jar) =&gt; {
      out.textContent = `${body.trim()} | ${jar.trim()} | ${document.body.dataset.subresource}`;
    }));
&lt;/script&gt;
</textarea>
      <div class="bar">
        <button id="load">Load</button>
        <span class="status" id="status">idle</span>
      </div>
    </section>

    <section>
      <label>Engine</label>
      <pre id="engine">nothing mounted</pre>
      <label style="margin-top: 0.6rem">Host exchanges</label>
      <pre id="exchanges"></pre>
    </section>

    <script type="importmap">
      {
        "imports": {
          "@bytecodealliance/preview2-shim/cli": "./node_modules/@bytecodealliance/preview2-shim/dist/browser/cli.js",
          "@bytecodealliance/preview2-shim/clocks": "./node_modules/@bytecodealliance/preview2-shim/dist/browser/clocks.js",
          "@bytecodealliance/preview2-shim/filesystem": "./node_modules/@bytecodealliance/preview2-shim/dist/browser/filesystem.js",
          "@bytecodealliance/preview2-shim/io": "./node_modules/@bytecodealliance/preview2-shim/dist/browser/io.js",
          "@bytecodealliance/preview2-shim/random": "./node_modules/@bytecodealliance/preview2-shim/dist/browser/random.js"
        }
      }
    </script>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
