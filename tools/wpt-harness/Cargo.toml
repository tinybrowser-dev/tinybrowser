[package]
name = "wpt-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Developer tooling only: not published, not part of the release binary.
publish = false

[lints]
workspace = true

[[bin]]
name = "wpt-harness"
path = "src/main.rs"

[dependencies]
wpt-report = { workspace = true }
# The real page engine, hosted in this process instead of a renderer child.
renderer = { workspace = true }
net = { workspace = true }
dial = { workspace = true }
# The browser's own cookie jar, so `document.cookie` behaves as it does there.
cookies = { workspace = true }
webstorage = { workspace = true }
bytes = "1"
http-body-util = "0.1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", default-features = false, features = ["rt", "time"] }
url = "2"
# `uuid()` in `.sub.headers`: wptserve substitutes a fresh UUID v4.
uuid = { version = "1", features = ["v4"] }
