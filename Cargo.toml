cargo-features = [
    # `[profile.release] rustflags` keeps release-only codegen shapes out of
    # dev/test links.
    "profile-rustflags",
]

[workspace]
exclude = ["third_party/rquickjs", "third_party/weedle4", "third_party/fontconfig-parser", "third_party/blitz", "third_party/html5ever"]
members = [
    "crates/browser",
    "crates/cdp",
    "crates/cookies",
    "crates/dial",
    "crates/enumerated",
    "crates/logging",
    "crates/net",
    "crates/renderer",
    "crates/secure-context",
    "crates/server",
    "crates/webstorage",
    "crates/wasm",
    "crates/webdriver",
    "crates/webidl-bindgen",
    # Developer tooling: the native test262 lane and the in-process
    # testharness lane. Never a release dependency.
    "tools/wpt-fast",
    "tools/wpt-harness",
    "tools/wpt-report",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Erick Christian <erickchristian48@gmail.com>"]

[workspace.dependencies]
browser = { path = "crates/browser" }
cdp = { path = "crates/cdp" }
cookies = { path = "crates/cookies" }
dial = { path = "crates/dial" }
enumerated = { path = "crates/enumerated" }
logging = { path = "crates/logging" }
# The fetch core. `native` adds the hyper/native-tls socket transport; only a
# host with sockets enables it, so the core alone builds for wasm.
net = { path = "crates/net", default-features = false }
renderer = { path = "crates/renderer" }
wpt-report = { path = "tools/wpt-report" }
secure-context = { path = "crates/secure-context" }
server = { path = "crates/server" }
webdriver = { path = "crates/webdriver" }
webstorage = { path = "crates/webstorage" }
# `[patch.crates-io]` supplies the fork path.
xml5ever = "0.40"
markup5ever = "0.40"
# WOFF/WOFF2 decoding for `@font-face` and `FontFace` sources.
wuff = "0.2"

[patch.crates-io]
# fontconfig-parser 0.5.8 pins roxmltree 0.20; usvg and fontique pin 0.21.
# The vendored crate is that release with the requirement moved to 0.21.1.
fontconfig-parser = { path = "third_party/fontconfig-parser" }
# anyrender_tiny_skia depends on the published debug_timer; Blitz uses its own
# path copy of the same version. One source keeps one crate in the graph.
debug_timer = { path = "third_party/blitz/packages/debug_timer" }
blitz-dom = { path = "third_party/blitz/packages/blitz-dom" }
blitz-html = { path = "third_party/blitz/packages/blitz-html" }
blitz-paint = { path = "third_party/blitz/packages/blitz-paint" }
blitz-traits = { path = "third_party/blitz/packages/blitz-traits" }
# The published 0.3.0-beta.4 predates the CopyStyleGetters trait the Stylo
# bump introduced; the vendored copy in the blitz fork has it, and renderer
# needs the trait to keep its direct clone_* calls compiling.
stylo_taffy = { path = "third_party/blitz/packages/stylo_taffy" }
# The xml5ever parser fork, shared with blitz-dom so the XML name and
# processing-instruction grammar has one implementation.
xml5ever = { path = "third_party/html5ever/xml5ever" }
rquickjs = { path = "third_party/rquickjs" }
rquickjs-core = { path = "third_party/rquickjs/core" }
rquickjs-macro = { path = "third_party/rquickjs/macro" }
rquickjs-sys = { path = "third_party/rquickjs/sys" }

[package]
name = "tinybrowser"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
browser = { workspace = true }
cdp = { workspace = true }
webdriver = { workspace = true }
logging = { workspace = true }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
base64 = "0.23"
# The process-level tests read the built-in identity so a version bump does not
# leave an assertion naming the old build.
net = { workspace = true, features = ["native"] }
# The TLS tests serve a real certificate, so `--tls-ca` has something to trust.
native-tls = "0.2"

# ─── Lints ────────────────────────────────────────────────────────────────────
# Strict (not strict-strict): `all` is error, `pedantic`/`cargo` are warnings.
# No `nursery` (experimental). Suppressions are `#[expect]` with a reason, so a
# stale one fails the build instead of rotting; `allow_attributes_without_reason`
# keeps even the generated glue honest. Hand-written code has no `#[allow]`.
# `webidl-bindgen` still emits `#[allow(dead_code)]` for two shapes it cannot
# usage-track, so `allow_attributes = "deny"` stays off (#165):
#
# - A dictionary member the implementation ignores still has to be converted,
#   because WebIDL throws `TypeError` for a present member with an invalid
#   value. Dropping the field to satisfy the lint would drop the conversion and
#   accept input the spec rejects (`ScrollIntoViewOptions`,
#   `ShadowRootInit`, `FocusOptions`, `ElementCreationOptions`). Keeping it
#   makes the field written-but-never-read, which is what `dead_code` reports.
# - Whether an enum or union conversion (`as_str`, `from_value`) is used
#   depends on the *consumer*: the generator's own output and hand-written
#   algorithms both call them (`InsertPosition::as_str` in
#   `js/bindings/node/element.rs`), and the generator has no type information
#   for the hand-written side. Emitting only the conversions its own output
#   calls would break those call sites.
#
# Every remaining allowance carries a reason naming the case. Empty contract
# traits are gone: an interface whose members are all generator-supplied now
# has no trait and no empty implementation naming one.
# The generator's other shapes — one dispatch function per member, borrowed
# union trials, merged identical arms — stopped triggering their lints instead
# of allowing them.
# `restriction` lints are denied individually (blanket is banned by clippy).
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
# Private single-binary repo, never published to crates.io; the metadata
# requirements (readme/keywords/categories/license) don't apply.
cargo_common_metadata = { level = "allow", priority = 1 }
# Duplicate crate versions are upstream transitive splits (syn 2/3,
# miniz_oxide via png/flate2, synstructure, num-bigint, embedded-io) that no
# bump removes without breaking a pin. Measured, not guessed, at every size
# checkpoint; see docs/size.md.
multiple_crate_versions = { level = "allow", priority = 1 }

# restriction: explicit, no blanket
todo = "deny"
unimplemented = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
let_underscore_future = "deny"
unused_result_ok = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
mem_forget = "deny"
not_unsafe_ptr_arg_deref = "deny"
ptr_as_ptr = "deny"
ref_as_ptr = "deny"
transmute_ptr_to_ptr = "deny"
cast_ptr_alignment = "deny"
lossy_float_literal = "deny"
implicit_saturating_sub = "deny"
dbg_macro = "deny"
rc_mutex = "deny"
redundant_clone = "deny"
needless_collect = "deny"

# ─── Release profile ──────────────────────────────────────────────────────────
# The tuned profile from docs/size.md: every tuned marginal measured
# there assumes exactly these flags. Lives here so any measurement in the doc
# reproduces verbatim (`cargo build --release`, no env overrides).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# No unwinder runs (abort panics, QuickJS uses setjmp), so no function needs
# unwind tables. Emitting none at codegen beats deleting them post-link: the
# bytes are never produced. The panic hook still runs (see logging).
rustflags = ["-C", "force-unwind-tables=no"]

# `[unstable] build-std` applies to every profile. In dev/test that means std
# is built at `opt-level = 0` instead of the toolchain's release-optimized
# prebuilt std, which measurably slowed the suite: `cargo test -p renderer`
# went from 13.85s to 24.9s. Optimize the four crates std owns; our crates and
# dependencies keep the dev profile's settings so compiles stay fast.
[profile.dev.package.std]
opt-level = 2
[profile.dev.package.core]
opt-level = 2
[profile.dev.package.alloc]
opt-level = 2
[profile.dev.package.panic_abort]
opt-level = 2

# ─── WPT profile ──────────────────────────────────────────────────────────────
# Conformance runs measure the engine against testharness file timeouts, and
# the per-push wall clock is CPU-bound. Build time is excluded from that
# budget, so pay for runtime speed: optimize, drop dev's assertions and
# overflow checks, and let thin LTO fold calls across the harness, the engine,
# and QuickJS's Rust glue. Line tables keep crash frames usable without the
# full debuginfo that inflated the CI artifact to hundreds of MB.
[profile.wpt]
inherits = "dev"
opt-level = 3
debug-assertions = false
overflow-checks = false
lto = "thin"
debug = 1
