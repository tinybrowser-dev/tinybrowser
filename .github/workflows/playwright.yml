# Runs upstream Playwright's `tests/page/` specs against tinybrowser over CDP
# and gates every test against `tools/playwright/pw-expectations.json`.
name: Playwright

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "third_party/**"
      - "tools/playwright/**"
      - ".github/workflows/playwright.yml"
  pull_request:
    paths:
      - "crates/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "third_party/**"
      - "tools/playwright/**"
      - ".github/workflows/playwright.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  OPENSSL_NO_VENDOR: "1"

jobs:
  upstream-playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          libssl-dev pkg-config
      - name: Toolchain
        run: |
          rustup toolchain install --profile minimal --component rust-src
          cargo --version
      - name: Submodules
        run: |
          git submodule update --init --depth 1 --jobs 4 \
            third_party/blitz third_party/rquickjs third_party/html5ever
          git -C third_party/rquickjs submodule update --init --depth 1 sys/quickjs
      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Build tinybrowser
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo build --profile wpt -p tinybrowser
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup upstream Playwright
        run: node tools/playwright/upstream-setup.mjs
      - name: Run upstream Playwright gate
        run: TINYBROWSER_BINARY="$PWD/target/wpt/tinybrowser" node tools/playwright/upstream-run.mjs
