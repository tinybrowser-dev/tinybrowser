# Unified CI pipeline:
#
#   Stage 1 (parallel):
#     check       — formatting, clippy (-D warnings), embedded JS syntax,
#                   realm-free layer check, parsed-type guards, rustdoc, Python
#                   stack, workspace tests, wasm32-wasip2 check, and the
#                   Playwright internal bridge spec.
#     sandbox     — macOS & Windows clippy and sandbox tests.
#     playwright  — upstream Playwright `tests/page/` specs against tinybrowser
#                   over CDP, gated by `tools/playwright/pw-expectations.json`.
#
#   Stage 2 (after check + playwright pass, when relevant paths changed):
#     wpt-*       — full WPT suite (14 in-process harness chunks + 6 WebDriver
#                   chunks) + test262, merged and published to
#                   `tinybrowser-dev/tinybrowser-wpt-results`.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      harness-chunks:
        description: In-process chunk jobs; ~4 vCPUs each.
        type: string
        default: "14"
      webdriver-chunks:
        description: WebDriver chunk jobs; harness + WebDriver must total <= 20.
        type: string
        default: "6"
      test-types:
        description: Space-separated wptrunner test types; stays last (nargs).
        type: string
        default: "testharness crashtest reftest wdspec"
      exclude:
        description: Space-separated upstream --exclude values.
        type: string
        default: "worker"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  # Line tables keep panic and crash backtraces usable (file:line) at a
  # fraction of full debuginfo; the 14 GB runner disk stays comfortable.
  CARGO_PROFILE_WPT_DEBUG: "line-tables-only"
  # Mirrors the flake devShell: link the runner's OpenSSL instead of building
  # a vendored copy.
  OPENSSL_NO_VENDOR: "1"
  # Dispatch inputs are empty on pushes, so every use goes through these.
  WPT_HARNESS_CHUNKS: ${{ inputs.harness-chunks || '14' }}
  WPT_WEBDRIVER_CHUNKS: ${{ inputs.webdriver-chunks || '6' }}
  WPT_TEST_TYPES: ${{ inputs.test-types || 'testharness crashtest reftest wdspec' }}
  WPT_EXCLUDE: ${{ inputs.exclude || 'worker' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.detect.outputs.playwright }}
      wpt: ${{ steps.detect.outputs.wpt }}
    steps:
      - id: detect
        name: Detect affected suites
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" || -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "playwright=true" >> "$GITHUB_OUTPUT"
            echo "wpt=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files="$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename')"; then
            echo "::warning::could not compare $BEFORE...$AFTER; running all suites"
            echo "playwright=true" >> "$GITHUB_OUTPUT"
            echo "wpt=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pw=false
          wpt=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              crates/*|src/*|Cargo.toml|Cargo.lock|build.rs|.cargo/*|rust-toolchain.toml|third_party/*|tools/playwright/*|.github/workflows/ci.yml)
                pw=true
                ;;
            esac
            if [[ "$f" != *.md ]]; then
              case "$f" in
                crates/*|src/*|tests/*|Cargo.toml|Cargo.lock|build.rs|.gitmodules|.cargo/*|rust-toolchain.toml|third_party/*|tools/wpt/*|tools/wpt-fast/*|tools/wpt-harness/*|tools/wpt-report/*|tools/binary-path|flake.nix|flake.lock|.github/workflows/ci.yml)
                  wpt=true
                  ;;
              esac
            fi
          done <<< "$files"
          echo "playwright=$pw" >> "$GITHUB_OUTPUT"
          echo "wpt=$wpt" >> "$GITHUB_OUTPUT"
          echo "playwright=$pw wpt=$wpt"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          libssl-dev pkg-config
      - name: Toolchain
        run: |
          rustup toolchain install --profile minimal \
            --component rust-src --component clippy --component rustfmt
          # The browser component is a second target of the same workspace, and
          # it is the one that rots silently: a `net` change that reaches for a
          # socket still compiles for the host.
          rustup target add wasm32-wasip2
          cargo --version
      - name: Submodules (build inputs and the Python check, shallow)
        run: |
          git submodule update --init --depth 1 --jobs 4 \
            third_party/blitz third_party/rquickjs third_party/html5ever \
            third_party/wpt
          git -C third_party/rquickjs submodule update --init --depth 1 sys/quickjs
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Workspace gate
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: tools/check clippy
      - name: Tests
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo test --workspace
      - name: Wasm component
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo check -p tinybrowser-wasm --target wasm32-wasip2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/playwright/package-lock.json
      - name: Playwright internal bridge
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: tools/playwright/run internal-bridge.spec.js

  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install --profile minimal \
            --component rust-src --component clippy
          cargo --version
      - name: Submodules (build inputs only, shallow)
        shell: bash
        run: |
          git submodule update --init --depth 1 --jobs 4 \
            third_party/blitz third_party/rquickjs third_party/html5ever
          git -C third_party/rquickjs submodule update --init --depth 1 sys/quickjs
      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Clippy and sandbox tests
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export CFLAGS=""
          fi
          cargo clippy -p browser --all-targets -- -D warnings
          cargo test -p browser -- child::sandbox --nocapture

  playwright:
    name: playwright
    needs: [changes]
    if: ${{ needs.changes.outputs.playwright == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          libssl-dev pkg-config
      - name: Toolchain
        run: |
          rustup toolchain install --profile minimal --component rust-src
          cargo --version
      - name: Submodules
        run: |
          git submodule update --init --depth 1 --jobs 4 \
            third_party/blitz third_party/rquickjs third_party/html5ever
          git -C third_party/rquickjs submodule update --init --depth 1 sys/quickjs
      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Build tinybrowser
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo build --profile wpt -p tinybrowser
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup upstream Playwright
        run: node tools/playwright/upstream-setup.mjs
      - name: Run upstream Playwright gate
        run: TINYBROWSER_BINARY="$PWD/target/wpt/tinybrowser" node tools/playwright/upstream-run.mjs

  wpt-plan:
    name: wpt plan
    needs: [changes, check, playwright]
    if: ${{ !cancelled() && needs.changes.outputs.wpt == 'true' && needs.check.result == 'success' && (needs.playwright.result == 'success' || needs.playwright.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      harness: ${{ steps.plan.outputs.harness }}
      webdriver: ${{ steps.plan.outputs.webdriver }}
    steps:
      - id: plan
        name: Build the chunk lists
        run: |
          set -euo pipefail
          total=$(( WPT_HARNESS_CHUNKS + WPT_WEBDRIVER_CHUNKS ))
          if (( total > 20 )); then
            echo "::error::harness + webdriver chunks is $total; the repository limit is 20"
            exit 1
          fi
          echo "harness=[$(seq -s, 1 "$WPT_HARNESS_CHUNKS")]" >> "$GITHUB_OUTPUT"
          echo "webdriver=[$(seq -s, 1 "$WPT_WEBDRIVER_CHUNKS")]" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - name: WPT checkout (pinned, shallow)
        run: git submodule update --init --depth 1 third_party/wpt
      - uses: astral-sh/setup-uv@v10.3.3
      - name: WPT manifest (built once for every chunk)
        run: |
          python3 tools/wpt/cli.py manifest
          mkdir -p wpt-manifest
          cp third_party/wpt/MANIFEST.json wpt-manifest/
      - uses: actions/upload-artifact@v7
        with:
          name: wpt-manifest
          path: wpt-manifest/
          retention-days: 3

  wpt-build:
    name: wpt build ${{ matrix.name }}
    needs: [changes, check, playwright]
    if: ${{ !cancelled() && needs.changes.outputs.wpt == 'true' && needs.check.result == 'success' && (needs.playwright.result == 'success' || needs.playwright.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: browser
            package: tinybrowser
            binary: tinybrowser
            output: tinybrowser-wpt
            artifact: tinybrowser-wpt
          - name: harness
            package: wpt-harness
            binary: wpt-harness
            output: wpt-harness
            artifact: wpt-harness-bin
          - name: fast
            package: wpt-fast
            binary: wpt-fast
            output: wpt-fast
            artifact: wpt-fast-bin
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          libfontconfig1-dev libssl-dev pkg-config
      - name: Toolchain
        run: |
          rustup toolchain install --profile minimal --component rust-src
          cargo --version
      - name: Submodules (build inputs only, shallow)
        run: |
          git submodule update --init --depth 1 --jobs 4 \
            third_party/blitz third_party/rquickjs third_party/html5ever
          git -C third_party/rquickjs submodule update --init --depth 1 sys/quickjs
      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: |
          cargo build --profile wpt --locked -p "${{ matrix.package }}"
          cp "$(./tools/binary-path --profile wpt "${{ matrix.binary }}")" \
            "${{ matrix.output }}"
          ls -l "${{ matrix.output }}"
      - name: Check runtime libraries
        if: ${{ matrix.name == 'harness' }}
        run: |
          missing="$(ldd "${{ matrix.output }}" | grep 'not found' || true)"
          if [[ -n "$missing" ]]; then
            echo "::error::missing runtime libraries in the runner image:"$'\n'"$missing"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          retention-days: 3

  wpt-harness:
    name: wpt harness chunk ${{ matrix.chunk }}
    needs: [wpt-plan, wpt-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.wpt-plan.outputs.harness) }}
    steps:
      - uses: actions/checkout@v7
      - name: WPT checkout (pinned, shallow)
        run: git submodule update --init --depth 1 third_party/wpt
      - uses: astral-sh/setup-uv@v10.3.3
      - name: WPT revision
        id: wpt
        run: echo "rev=$(git -C third_party/wpt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: third_party/wpt/_venv3
          key: wpt-venv-${{ runner.os }}-${{ steps.wpt.outputs.rev }}
      - uses: actions/download-artifact@v8
        with:
          name: wpt-harness-bin
      - uses: actions/download-artifact@v8
        with:
          name: wpt-manifest
          path: wpt-manifest
      - name: Shared manifest
        run: |
          if [[ -f wpt-manifest/MANIFEST.json ]]; then
            cp wpt-manifest/MANIFEST.json third_party/wpt/MANIFEST.json
          else
            echo "::error::no shared manifest; the plan job did not upload one"
            exit 1
          fi
      - name: Run chunk ${{ matrix.chunk }}
        env:
          REPORT: ${{ github.workspace }}/wpt-report-harness-${{ matrix.chunk }}.json
          RAW: ${{ github.workspace }}/wpt-harness-${{ matrix.chunk }}.log
        run: |
          set -euo pipefail
          chmod +x wpt-harness
          python3 tools/wpt/cli.py run in-process / \
            --fast-binary "$PWD/wpt-harness" \
            --jobs 4 \
            --total-chunks "$WPT_HARNESS_CHUNKS" \
            --this-chunk "${{ matrix.chunk }}" \
            --report "$REPORT" 2>&1 | tee "$RAW"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: wpt-report-harness-${{ matrix.chunk }}
          path: wpt-report-harness-${{ matrix.chunk }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Raw log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wpt-raw-harness-${{ matrix.chunk }}
          path: wpt-harness-${{ matrix.chunk }}.log
          if-no-files-found: ignore
          retention-days: 3

  wpt-webdriver:
    name: wpt webdriver chunk ${{ matrix.chunk }}
    needs: [wpt-plan, wpt-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.wpt-plan.outputs.webdriver) }}
    steps:
      - uses: actions/checkout@v7
      - name: WPT checkout (pinned, shallow)
        run: git submodule update --init --depth 1 third_party/wpt
      - uses: astral-sh/setup-uv@v10.3.3
      - name: WPT revision
        id: wpt
        run: echo "rev=$(git -C third_party/wpt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: third_party/wpt/_venv3
          key: wpt-venv-${{ runner.os }}-${{ steps.wpt.outputs.rev }}
      - uses: actions/download-artifact@v8
        with:
          name: tinybrowser-wpt
      - uses: actions/download-artifact@v8
        with:
          name: wpt-manifest
          path: wpt-manifest
      - name: Shared manifest
        run: |
          if [[ -f wpt-manifest/MANIFEST.json ]]; then
            cp wpt-manifest/MANIFEST.json third_party/wpt/MANIFEST.json
          else
            echo "::error::no shared manifest; the plan job did not upload one"
            exit 1
          fi
      - name: Run chunk ${{ matrix.chunk }}
        env:
          BINARY: ${{ github.workspace }}/tinybrowser-wpt
          REPORT: ${{ github.workspace }}/wpt-report-webdriver-${{ matrix.chunk }}.json
          RAW: ${{ github.workspace }}/wpt-report-webdriver-${{ matrix.chunk }}.raw.log
        run: |
          set -euo pipefail
          chmod +x "$BINARY"
          excludes=()
          for value in $WPT_EXCLUDE; do excludes+=("--exclude=$value"); done
          types=()
          for value in $WPT_TEST_TYPES; do types+=("$value"); done
          if (( ${#types[@]} == 0 )); then
            echo "::error::test-types is empty; nothing would run"
            exit 1
          fi
          python3 tools/wpt/cli.py run webdriver --binary "$BINARY" \
            --exclude-in-process -- \
            --no-manifest-update \
            --log-wptreport "$REPORT" \
            --log-raw "$RAW" \
            --no-fail-on-unexpected \
            --processes 4 \
            --total-chunks "$WPT_WEBDRIVER_CHUNKS" \
            --this-chunk "${{ matrix.chunk }}" \
            "${excludes[@]}" \
            --test-types "${types[@]}"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: wpt-report-webdriver-${{ matrix.chunk }}
          path: wpt-report-webdriver-${{ matrix.chunk }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Raw log (partial chunks still explain themselves)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wpt-raw-webdriver-${{ matrix.chunk }}
          path: wpt-report-webdriver-${{ matrix.chunk }}.raw.log
          if-no-files-found: ignore
          retention-days: 3

  wpt-test262:
    name: wpt test262
    needs: [wpt-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: WPT checkout (pinned, shallow)
        run: git submodule update --init --depth 1 third_party/wpt
      - uses: actions/download-artifact@v8
        with:
          name: wpt-fast-bin
      - name: Run test262
        env:
          REPORT: ${{ github.workspace }}/wpt-report-test262.json
        run: |
          set -euo pipefail
          chmod +x wpt-fast
          python3 tools/wpt/cli.py run test262 \
            --fast-binary "$PWD/wpt-fast" \
            --jobs 4 \
            --report "$REPORT"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: wpt-report-test262
          path: wpt-report-test262.json
          if-no-files-found: error
          retention-days: 7

  wpt-score:
    name: wpt score
    needs: [wpt-plan, wpt-harness, wpt-webdriver, wpt-test262]
    if: ${{ !cancelled() && needs.wpt-harness.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wpt-report-*
          path: reports
          merge-multiple: true
      - name: Corpus counts
        run: |
          set -euo pipefail
          revision=$(python3 - <<'PY'
          import glob, json
          for path in sorted(glob.glob("reports/*.json")):
              try:
                  with open(path) as handle:
                      data = json.load(handle)
              except (OSError, ValueError):
                  continue
              revision = (data.get("run_info") or {}).get("revision")
              if revision:
                  print(revision)
                  break
          PY
          )
          if [[ -z "$revision" ]]; then
            echo "::warning::no WPT revision in the reports; the denominator will be the reported subtests only"
            exit 0
          fi
          if ! python3 tools/wpt/cli.py corpus --revision "$revision" --out corpus.json.gz; then
            echo "::warning::could not fetch Chrome's corpus counts; the denominator will be the reported subtests only"
            rm -f corpus.json.gz
          fi
      - name: Merge chunk reports
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(reports/*.json)
          expected=$(( WPT_HARNESS_CHUNKS + WPT_WEBDRIVER_CHUNKS + 1 ))
          echo "downloaded ${#reports[@]}/$expected chunk reports"
          if (( ${#reports[@]} == 0 )); then
            echo "::error::no chunk reports to merge"
            exit 1
          fi
          corpus_args=()
          if [[ -s corpus.json.gz ]]; then
            corpus_args=(--corpus corpus.json.gz)
          fi
          python3 tools/wpt/cli.py merge --strict-skips "${reports[@]}" \
            --out merged.json --summary-out run.json \
            --product-revision "$GITHUB_SHA" "${corpus_args[@]}" | tee summary.txt
          if (( ${#reports[@]} != expected )); then
            echo "::error::incomplete run: ${#reports[@]} of $expected chunk reports"
            exit 1
          fi
      - name: Run page summary
        if: ${{ !cancelled() && hashFiles('summary.txt') != '' }}
        run: |
          {
            printf '## WPT — %s (harness %s + webdriver %s chunks, exclude: %s)\n' \
              "$WPT_TEST_TYPES" "$WPT_HARNESS_CHUNKS" "$WPT_WEBDRIVER_CHUNKS" "${WPT_EXCLUDE:-none}"
            echo
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: wpt-merged
          path: |
            merged.json
            run.json
            corpus.json.gz
            summary.txt
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        continue-on-error: true
        with:
          client-id: ${{ vars.WPT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WPT_APP_PRIVATE_KEY }}
          owner: tinybrowser-dev
          repositories: tinybrowser-wpt-results
      - name: Publish run record
        if: ${{ steps.app-token.outcome == 'success' }}
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ ! -f run.json ]]; then
            echo "::warning::no run.json (the merge did not finish); skipping the history publish"
            exit 0
          fi
          if [[ -z "${TOKEN}" ]]; then
            echo "::warning::the GitHub App returned no token; skipping the history publish"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/tinybrowser-dev/tinybrowser-wpt-results.git" \
            results
          python3 tools/wpt/cli.py publish \
            --record run.json --data results --sha "$GITHUB_SHA"
          python3 tools/wpt/cli.py summary --data results >> "$GITHUB_STEP_SUMMARY"
          cd results
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "no change to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
