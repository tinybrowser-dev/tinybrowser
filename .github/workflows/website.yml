# The public site: the home page, /demo, and the WPT dashboard at /wpt.
#
# Triggers:
#
#   push          the website changed; rebuild with the latest release wasm and
#                 published WPT data.
#   workflow_run  CI finished on main (may have published new WPT results) or
#                 Release finished (published a new wasm32-wasip2 artifact).
#
# Deploy goes through Alchemy (`Cloudflare.Website.Astro`), which runs the
# Astro build and uploads the Worker + static assets to Cloudflare. The stack
# refuses any stage but prod.

name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a queued run waits rather than racing the upload.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name == 'Release' || github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WPT_RESULTS_DIR: ${{ github.workspace }}/wpt-results
      TINYBROWSER_WASM_PATH: ${{ github.workspace }}/wasm-release/tinybrowser.wasm
    steps:
      - uses: actions/checkout@v7

      - name: Download latest wasm release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p wasm-release
          gh release download --repo "${{ github.repository }}" \
            --pattern 'tinybrowser-*-wasm32-wasip2.tar.gz' \
            --dir wasm-release
          tar -xzf wasm-release/tinybrowser-*-wasm32-wasip2.tar.gz \
            -C wasm-release --strip-components=1
          ls -lh wasm-release/tinybrowser.wasm

      # The published history. A missing record is not an error: the site
      # renders its empty state and the first WPT run fills it in.
      - uses: actions/checkout@v7
        with:
          repository: tinybrowser-dev/tinybrowser-wpt-results
          path: wpt-results

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Check
        working-directory: website
        run: bun run contrast && bun run typecheck && bun run lint && bun run build

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: website
        run: bunx alchemy deploy --stage prod --yes

      # Without the token there is nowhere to deploy yet, but the site still
      # builds so the push is checked and the log says why nothing shipped.
      - name: Build without deploying
        if: env.CLOUDFLARE_API_TOKEN == ''
        working-directory: website
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; the site built but was not deployed."
