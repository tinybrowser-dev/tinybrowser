# The public site: the home page and the WPT dashboard at /wpt.
#
# Two triggers, because the two inputs are independent:
#
#   push          the page changed; rebuild with whatever data is published.
#   workflow_run  a WPT run finished and may have pushed a new record to the
#                 results repo, so the page must be rebuilt with it.
#
# The dashboard reads the results repo at build time and copies the record into
# the site, so the deployed pages are a static snapshot; every file the page
# reads stays fetchable under /wpt/data.
#
# Deploy goes through Alchemy (`Cloudflare.Website.Astro`), which runs the
# Astro build and uploads the Worker + static assets to Cloudflare. The stack
# refuses any stage but prod.

name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "crates/wasm/**"
      - "crates/net/**"
      - "crates/dial/**"
      - ".github/workflows/website.yml"
  workflow_run:
    workflows: [WPT]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a queued run waits rather than racing the upload.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WPT_RESULTS_DIR: ${{ github.workspace }}/wpt-results
    steps:
      - uses: actions/checkout@v7

      # Build the WASI Preview 2 component so `/demo` always ships the current
      # engine from `main` alongside the static site and `/api/hop` Worker.
      - name: Rust toolchain (wasm32-wasip2)
        run: |
          rustup toolchain install --profile minimal --component rust-src
          rustup target add wasm32-wasip2
      - name: Submodules (wasm build inputs, shallow)
        run: |
          git submodule update --init --depth 1 --jobs 4 \
            third_party/blitz third_party/rquickjs third_party/html5ever
          git -C third_party/rquickjs submodule update --init --depth 1 sys/quickjs
      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-wasm-
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Build wasm component
        env:
          CARGO_INCREMENTAL: "0"
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo build --release --locked -p tinybrowser-wasm --target wasm32-wasip2

      # The published history. A missing record is not an error: the site
      # renders its empty state and the first WPT run fills it in.
      - uses: actions/checkout@v7
        with:
          repository: tinybrowser-dev/tinybrowser-wpt-results
          path: wpt-results

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Check
        working-directory: website
        run: bun run check

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: website
        run: bunx alchemy deploy --stage prod --yes

      # Without the token there is nowhere to deploy yet, but the site still
      # builds so the push is checked and the log says why nothing shipped.
      - name: Build without deploying
        if: env.CLOUDFLARE_API_TOKEN == ''
        working-directory: website
        run: |
          bun run build
          echo "::notice::CLOUDFLARE_API_TOKEN is not set; the site built but was not deployed."
